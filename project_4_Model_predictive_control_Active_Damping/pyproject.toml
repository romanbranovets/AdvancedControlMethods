[project]
name = "mpc-vibration-damping"
version = "0.1.0"
description = "Active vibration damping using MPC vs PID in 2D"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "plotly>=5.14",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
mpc-demo = "scripts.run_comparison:main"
